[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeflow-ai"
version = "0.1.0"
description = "Declarative automata runtime control with UPPAAL verification and replaceable adapters"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
safeflow = "safeflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeflow = ["policies/*.json"]
