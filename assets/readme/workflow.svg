<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">SafeFlow proposal interception</title><desc id="desc">AI proposals are logged and checked before execution. Humans bypass safety guards and both sources update observed state.</desc>
