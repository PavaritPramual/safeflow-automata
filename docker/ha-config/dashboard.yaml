title: SafeFlow Lab
views:
  - title: Simulated home
    path: home
    cards:
      - type: markdown
        content: |
          ## SafeFlow AI
          บ้านจำลองหนึ่งห้อง — เริ่มควบคุมได้เมื่อสถานะ Readiness เป็น ready
          ทุกข้อเสนอผ่านตัวกำกับตามนิยามที่ทวนสอบแล้ว รวมข้อยกเว้นคำสั่งคน
          สวิตช์ส่งคำขอเข้าคิว ปุ่ม **Run one round** ใช้คำสั่งคนก่อน AI หนึ่งรอบ
      - type: entities
        title: Room and goals
        entities:
          - sensor.safeflow_temperature
          - sensor.safeflow_power
          - sensor.safeflow_energy
          - sensor.safeflow_simulation_time
          - sensor.safeflow_pending
          - sensor.safeflow_status
          - sensor.safeflow_readiness
          - sensor.safeflow_decision
          - sensor.safeflow_decision_reason
          - sensor.safeflow_cooldown
          - number.safeflow_target_temperature
          - switch.safeflow_light_required
      - type: entities
        title: Propose device commands
        entities:
          - switch.safeflow_air_conditioner
          - switch.safeflow_heater
          - switch.safeflow_ventilation_fan
          - switch.safeflow_light
          - button.safeflow_step
          - button.safeflow_reset
