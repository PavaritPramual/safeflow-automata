<polyline points="103,320 150,320" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="320,320 650,320" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">ac_cool</text>
<text x="485" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">[H or (AI and G_ac)]</text>
<text x="485" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#111">/ allow</text>
<polyline points="745,360 745,407 235,407 235,360" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#111">ac_off [AI or H] / allow; start rest := 0</text>
<text x="75" y="449" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#111">Off: repeated ac_off does not restart the rest clock</text>
<text x="75" y="480" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#111">Off: AI ac_cool [not G_ac] / block</text>
<text x="930" y="184" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111">Heater</text>
<rect x="1030" y="280" width="170" height="80" rx="12" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="1115.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111">Off</text>
<text x="1115.0" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#111">heater = off</text>
<rect x="1530" y="280" width="190" height="80" rx="12" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="1625.0" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111">On</text>
<text x="1625.0" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#111">heater = on</text>
<circle cx="975" cy="320" r="8" fill="#111"/>
<polyline points="983,320 1030,320" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
